# .pre-commit-config.yaml: checks that run on your machine before each commit (Playbook VC-10).
# Set up once:   uv run pre-commit install
# Run on demand: uv run pre-commit run --all-files
#
# Replace the <PLACEHOLDERS> with the newest released tag of each project
# (see starter_kit/PLACEHOLDERS.md: open the repository's Releases page, copy the tag).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check      # lint
      - id: ruff-format     # format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks        # blocks commits that contain a secret (CFG-03)
